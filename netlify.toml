# Tells Netlify how to build and publish the Astro site.
# Without this, a site first set up for plain HTML publishes the repo root,
# which has no index.html, and every page returns "Page not found".

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node >= 22.23.4; "22" resolves to the latest 22.x release.
  NODE_VERSION = "22"
